<!DOCTYPE html>

<!-- Adding Attributes to tags  lang, characterset.. -->

<html lang="en">
  <!--  Head Tag ; contains data important for web page but not displayed -->
  <head>
    <!-- Title tag gives name of the webpage -->
    <title>Terrarium Building Project</title>

    <!-- SELF CLOSING TAGS -->
    <!-- 1.Meta tag provides information of web page like author .. -->

    <meta charset="utf-8" />
    <meta name="viewport" ,content="width=device-width,initial-scale=1" />

    <!-- 2. link ; adds external link in webpage -->

    <link rel="stylesheet" href="./style.css" />

    <!--  href- attribute for links; rel- relationship with this web page, noopener - opens in web with security -->
    <!-- <a href="https://www.notion.com", rel="noopener" ></a> -->

    <!-- Script tag for linking java script files -->
    <script src="./script.js" defer></script>
  </head>
